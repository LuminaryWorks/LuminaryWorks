# LuminaryWorks optional shared control plane
#
#   Identity (Logto) + Auth Gateway + Entitlement are the core.
#   AI Platform and observability are opt-in Compose profiles.
#
# The control plane is OPTIONAL. Every product must still start standalone with
# `identity=external_oidc|local`, `entitlement=off|offline_license` and
# `ai=off|local_byok`. See spec/composable-deployment.md.
#
# Usage (from repo root):
#   cp deploy/env/control-plane.env.example deploy/env/control-plane.env  # then fill in real secrets
#   node scripts/preflight-control-plane.mjs --manifest deploy/manifests/control-plane.dev.json
#   docker compose --env-file deploy/env/control-plane.env -f deploy/compose/control-plane.yaml up -d
#
#   Local DB/Redis debugging ports (never in pilot/production):
#     ... -f deploy/compose/control-plane.yaml -f deploy/compose/control-plane.dev-ports.yaml up -d
#   Optional profiles:
#     ... --profile ai --profile observability up -d
#   Object storage (AIStor Free; not in offline packs — needs overlay + license):
#     ... -f deploy/compose/control-plane.object-storage.yaml --profile object-storage up -d
#
# Contract notes:
#   * No `container_name`: this stack must be able to run next to product stacks.
#   * No `host.docker.internal`: services address each other by Compose DNS name.
#   * No committed passwords: every secret is a required variable (`${VAR:?...}`).
#   * Databases and Redis have no host ports and live on an `internal` network.
#   * Host publishing defaults to loopback; terminate TLS at a reverse proxy in
#     pilot/production and set CONTROL_PLANE_BIND_ADDR accordingly.
#   * One Postgres instance (`control-plane-db`) holds four logical databases
#     (Identity / Entitlement / Notification / AI Platform) with separate roles.
#     Service dirs do not ship their own Postgres Compose — host apps use env → :5433.

name: ${CONTROL_PLANE_PROJECT:-luminary-control-plane}

x-restart: &restart
  restart: unless-stopped

networks:
  # Data tier: no egress, reachable only by control-plane services.
  control-data:
    internal: true
  # Edge tier: control-plane services + product stacks that opt in.
  # Product Compose projects join it with:
  #   networks: { luminary-control-edge: { external: true } }
  control-edge:
    name: ${CONTROL_PLANE_EDGE_NETWORK:-luminary-control-edge}

volumes:
  control-plane-db-data:
  ai-platform-data:

services:
  # Shared data tier: one Postgres, four DBs + four app roles (see init/).
  # Admin role is for bootstrap / ops only — apps use IDENTITY_DB_* /
  # ENTITLEMENT_DB_* / NOTIFICATION_DB_* / AI_PLATFORM_DB_* against their own dbname.
  control-plane-db:
    <<: *restart
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${CONTROL_PLANE_DB_ADMIN_USER:-lw_pg}
      POSTGRES_PASSWORD: ${CONTROL_PLANE_DB_ADMIN_PASSWORD:?set CONTROL_PLANE_DB_ADMIN_PASSWORD in deploy/env/control-plane.env}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:-logto}
      IDENTITY_DB_NAME: ${IDENTITY_DB_NAME:-logto}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD in deploy/env/control-plane.env}
      ENTITLEMENT_DB_USER: ${ENTITLEMENT_DB_USER:-entitlement}
      ENTITLEMENT_DB_NAME: ${ENTITLEMENT_DB_NAME:-entitlement}
      ENTITLEMENT_DB_PASSWORD: ${ENTITLEMENT_DB_PASSWORD:?set ENTITLEMENT_DB_PASSWORD in deploy/env/control-plane.env}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:-notification}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:-notification}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in deploy/env/control-plane.env}
      AI_PLATFORM_DB_USER: ${AI_PLATFORM_DB_USER:-ai_platform}
      AI_PLATFORM_DB_NAME: ${AI_PLATFORM_DB_NAME:-ai_platform}
      AI_PLATFORM_DB_PASSWORD: ${AI_PLATFORM_DB_PASSWORD:?set AI_PLATFORM_DB_PASSWORD in deploy/env/control-plane.env}
    volumes:
      - control-plane-db-data:/var/lib/postgresql/data
      - ./init/control-plane-db.sh:/docker-entrypoint-initdb.d/01-control-plane-db.sh:ro
    networks:
      - control-data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${CONTROL_PLANE_DB_ADMIN_USER:-lw_pg} && psql -U ${CONTROL_PLANE_DB_ADMIN_USER:-lw_pg} -d ${IDENTITY_DB_NAME:-logto} -c 'select 1' >/dev/null && psql -U ${CONTROL_PLANE_DB_ADMIN_USER:-lw_pg} -d ${ENTITLEMENT_DB_NAME:-entitlement} -c 'select 1' >/dev/null && psql -U ${CONTROL_PLANE_DB_ADMIN_USER:-lw_pg} -d ${NOTIFICATION_DB_NAME:-notification} -c 'select 1' >/dev/null && psql -U ${CONTROL_PLANE_DB_ADMIN_USER:-lw_pg} -d ${AI_PLATFORM_DB_NAME:-ai_platform} -c 'select 1' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  identity-redis:
    <<: *restart
    image: ${REDIS_IMAGE:-redis:7-alpine}
    networks:
      - control-data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Identity = Logto. It exposes no /version endpoint of its own; the readiness
  # contract is the OIDC discovery document (see scripts/preflight-control-plane.mjs).
  # Image is a brand overlay on official svhd/logto (static assets only; Logto
  # source is untouched). Customer hosts run `--no-build --pull never`; `build:`
  # is for the pack machine only.
  identity:
    <<: *restart
    build:
      context: ../../identity/branding
      args:
        LOGTO_VERSION: ${LOGTO_VERSION:-1.22.0}
    image: ${IDENTITY_IMAGE:-luminaryworks/identity:1.22.0-lw1}
    depends_on:
      control-plane-db:
        condition: service_healthy
      identity-redis:
        condition: service_healthy
    environment:
      TRUST_PROXY_HEADER: "1"
      DB_URL: postgres://${IDENTITY_DB_USER:-logto}:${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD in deploy/env/control-plane.env}@control-plane-db:5432/${IDENTITY_DB_NAME:-logto}
      REDIS_URL: redis://identity-redis:6379
      ENDPOINT: ${IDENTITY_ENDPOINT:?set IDENTITY_ENDPOINT to the browser-reachable OIDC base URL}
      ADMIN_ENDPOINT: ${IDENTITY_ADMIN_ENDPOINT:?set IDENTITY_ADMIN_ENDPOINT to the browser-reachable admin URL}
    # `db seed` is idempotent; start_period covers the first seed + boot window.
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    ports:
      - "${CONTROL_PLANE_BIND_ADDR:-127.0.0.1}:${IDENTITY_PORT:-3001}:3001"
      - "${CONTROL_PLANE_ADMIN_BIND_ADDR:-127.0.0.1}:${IDENTITY_ADMIN_PORT:-3002}:3002"
    networks:
      - control-data
      - control-edge
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:3001/oidc/.well-known/openid-configuration || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    mem_limit: 1536m
    mem_reservation: 512m
    cpus: "1.0"
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Auth Gateway keeps products off a specific IdP: JWT `iss` stays upstream,
  # browser-reachable endpoints are rewritten to the gateway.
  auth-gateway:
    <<: *restart
    build:
      context: ../../services/auth-gateway
    image: ${AUTH_GATEWAY_IMAGE:-luminaryworks/auth-gateway:local}
    depends_on:
      identity:
        condition: service_healthy
    environment:
      AUTH_GATEWAY_PORT: "3010"
      AUTH_GATEWAY_PUBLIC_URL: ${AUTH_GATEWAY_PUBLIC_URL:?set AUTH_GATEWAY_PUBLIC_URL to the browser-reachable gateway base URL}
      UPSTREAM_ISSUER: ${AUTH_GATEWAY_UPSTREAM_ISSUER:-http://identity:3001/oidc}
      AUTH_GATEWAY_READY_UPSTREAM: ${AUTH_GATEWAY_READY_UPSTREAM:-1}
      AUTH_GATEWAY_CORS_ORIGINS: ${AUTH_GATEWAY_CORS_ORIGINS:-}
    ports:
      - "${CONTROL_PLANE_BIND_ADDR:-127.0.0.1}:${AUTH_GATEWAY_PORT:-3010}:3010"
    networks:
      - control-edge
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 256m
    mem_reservation: 64m
    cpus: "0.5"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  entitlement:
    <<: *restart
    mem_limit: 768m
    mem_reservation: 256m
    cpus: "1.0"
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ../../services/entitlement
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: ${ENTITLEMENT_IMAGE:-luminaryworks/entitlement:local}
    depends_on:
      control-plane-db:
        condition: service_healthy
      identity:
        condition: service_healthy
    environment:
      NODE_ENV: ${ENTITLEMENT_NODE_ENV:-production}
      ENTITLEMENT_PORT: "3040"
      ENTITLEMENT_DATABASE_URL: postgres://${ENTITLEMENT_DB_USER:-entitlement}:${ENTITLEMENT_DB_PASSWORD:?set ENTITLEMENT_DB_PASSWORD in deploy/env/control-plane.env}@control-plane-db:5432/${ENTITLEMENT_DB_NAME:-entitlement}
      ENTITLEMENT_MIGRATIONS_RUN: "true"
      ENTITLEMENT_SYNCHRONIZE: "false"
      # OIDC is the only auth mode that belongs in a shared control plane;
      # `legacy` shared-secret mode stays product-local and dev-only.
      ENTITLEMENT_AUTH_MODE: ${ENTITLEMENT_AUTH_MODE:-oidc}
      ENTITLEMENT_OIDC_ISSUER: ${ENTITLEMENT_OIDC_ISSUER:?set ENTITLEMENT_OIDC_ISSUER to the canonical IdP issuer}
      ENTITLEMENT_OIDC_AUDIENCE: ${ENTITLEMENT_OIDC_AUDIENCE:-https://entitlement.luminaryworks.dev}
      ENTITLEMENT_SERVICE_API_KEY: ${ENTITLEMENT_SERVICE_API_KEY:?set ENTITLEMENT_SERVICE_API_KEY in deploy/env/control-plane.env}
      ENTITLEMENT_PARTNER_SECRET_PEPPER: ${ENTITLEMENT_PARTNER_SECRET_PEPPER:?set ENTITLEMENT_PARTNER_SECRET_PEPPER in deploy/env/control-plane.env}
      ENTITLEMENT_PARTNER_TOKEN_SECRET: ${ENTITLEMENT_PARTNER_TOKEN_SECRET:?set ENTITLEMENT_PARTNER_TOKEN_SECRET in deploy/env/control-plane.env}
      ENTITLEMENT_LICENSE_PUBLIC_KEYS: ${ENTITLEMENT_LICENSE_PUBLIC_KEYS:-}
      ENTITLEMENT_GIT_SHA: ${ENTITLEMENT_GIT_SHA:-unknown}
      PAYMENT_CONFIG_MASTER_KEY: ${PAYMENT_CONFIG_MASTER_KEY:-}
      PAYMENT_TRUSTED_PROXIES: ${PAYMENT_TRUSTED_PROXIES:-}
      PAYMENT_GEO_DEFAULT_COUNTRY: ${PAYMENT_GEO_DEFAULT_COUNTRY:-}
      PAYMENT_MARKET_POLICY: ${PAYMENT_MARKET_POLICY:-hosted}
      PAYMENT_RECONCILE_PENDING_MINUTES: ${PAYMENT_RECONCILE_PENDING_MINUTES:-5}
      PAYMENT_CREDENTIAL_RETIRING_HOURS: ${PAYMENT_CREDENTIAL_RETIRING_HOURS:-48}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-true}
      ENTITLEMENT_CORS_ORIGINS: ${ENTITLEMENT_CORS_ORIGINS:-}
      ENTITLEMENT_TRIAL_PURGE_TARGETS: ${ENTITLEMENT_TRIAL_PURGE_TARGETS:-}
      ENTITLEMENT_ORDER_FULFILLED_TARGETS: ${ENTITLEMENT_ORDER_FULFILLED_TARGETS:-}
      ENTITLEMENT_ORDER_FULFILLED_TIMEOUT_MS: ${ENTITLEMENT_ORDER_FULFILLED_TIMEOUT_MS:-15000}
      # Empty base URL: credit outbox rows are marked sent. Set the in-network URL when --profile ai is on.
      AI_PLATFORM_BASE_URL: ${AI_PLATFORM_BASE_URL:-}
      AI_PLATFORM_INTERNAL_SERVICE_KEY: ${AI_PLATFORM_INTERNAL_SERVICE_KEY:-}
      AI_CREDIT_GRANT_BY_SKU_JSON: ${AI_CREDIT_GRANT_BY_SKU_JSON:-}
      AI_CREDIT_MICRO_PER_VOICE_SECOND: ${AI_CREDIT_MICRO_PER_VOICE_SECOND:-}
    ports:
      - "${CONTROL_PLANE_BIND_ADDR:-127.0.0.1}:${ENTITLEMENT_PORT:-3040}:3040"
    networks:
      - control-data
      - control-edge
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3040/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Auth-mail delivery for Logto HTTP Email connector (not product report SMTP).
  # Maddy (or Resend/Brevo) is reached via SMTP_* / API keys in control-plane.env.
  # Port 3055 avoids colliding with control-console :3050.
  notification:
    <<: *restart
    build:
      context: ../../services/notification
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: ${NOTIFICATION_IMAGE:-luminaryworks/notification:local}
    depends_on:
      control-plane-db:
        condition: service_healthy
    extra_hosts:
      # Host-published Maddy (:587). Inter-service traffic still uses Compose DNS.
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      NOTIFICATION_PORT: "3055"
      NOTIFICATION_DATABASE_URL: postgres://${NOTIFICATION_DB_USER:-notification}:${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in deploy/env/control-plane.env}@control-plane-db:5432/${NOTIFICATION_DB_NAME:-notification}
      NOTIFICATION_SERVICE_KEY: ${NOTIFICATION_SERVICE_KEY:?set NOTIFICATION_SERVICE_KEY in deploy/env/control-plane.env}
      NOTIFICATION_SECRET_KEY: ${NOTIFICATION_SECRET_KEY:?set NOTIFICATION_SECRET_KEY in deploy/env/control-plane.env}
      NOTIFICATION_MIGRATIONS_RUN: ${NOTIFICATION_MIGRATIONS_RUN:-true}
      EMAIL_AUTH_ENABLED: ${EMAIL_AUTH_ENABLED:-1}
      MAIL_FROM: ${MAIL_FROM:-auth@luminaryworks.dev}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-LuminaryWorks}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-false}
      SMTP_TLS_SERVERNAME: ${SMTP_TLS_SERVERNAME:-mail.luminaryworks.dev}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
    ports:
      - "${CONTROL_PLANE_BIND_ADDR:-127.0.0.1}:${NOTIFICATION_PORT:-3055}:3055"
    networks:
      - control-data
      - control-edge
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3055/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 256m
    mem_reservation: 64m
    cpus: "0.5"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Business superadmin SPA (catalog / payments / legal). Not Logto Admin (:3002).
  control-console:
    <<: *restart
    build:
      context: ../../apps/control-console
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: ${CONTROL_CONSOLE_IMAGE:-luminaryworks/control-console:local}
    depends_on:
      identity:
        condition: service_healthy
      entitlement:
        condition: service_healthy
    environment:
      NODE_ENV: production
      CONTROL_CONSOLE_PORT: "3050"
      CONTROL_CONSOLE_PUBLIC_URL: ${CONTROL_CONSOLE_PUBLIC_URL:-http://localhost:3050}
      CONTROL_CONSOLE_IDP_ISSUER: ${CONTROL_CONSOLE_IDP_ISSUER:-http://localhost:3001/oidc}
      CONTROL_CONSOLE_IDP_CLIENT_ID: ${CONTROL_CONSOLE_IDP_CLIENT_ID:-}
      CONTROL_CONSOLE_IDP_AUDIENCE: ${ENTITLEMENT_OIDC_AUDIENCE:-https://entitlement.luminaryworks.dev}
      CONTROL_CONSOLE_IDP_SCOPES: ${CONTROL_CONSOLE_IDP_SCOPES:-openid profile email offline_access entitlement:admin}
      CONTROL_CONSOLE_ENTITLEMENT_BASE_URL: ${CONTROL_CONSOLE_ENTITLEMENT_BASE_URL:-http://localhost:3040}
      CONTROL_CONSOLE_AUTH_EXPERIENCE_URL: ${CONTROL_CONSOLE_AUTH_EXPERIENCE_URL:-http://localhost:3050}
      CONTROL_CONSOLE_LEGAL_DOCS_URL: ${ENTITLEMENT_LEGAL_PUBLIC_BASE_URL:-https://docs.luminaryworks.dev/legal}
      CONTROL_CONSOLE_CAPACITY_DORIS_URL: ${CONTROL_CONSOLE_CAPACITY_DORIS_URL:-}
      CONTROL_CONSOLE_CAPACITY_STORAGE_URL: ${CONTROL_CONSOLE_CAPACITY_STORAGE_URL:-}
      CONTROL_CONSOLE_GIT_SHA: ${CONTROL_CONSOLE_GIT_SHA:-unknown}
    ports:
      - "${CONTROL_PLANE_BIND_ADDR:-127.0.0.1}:${CONTROL_CONSOLE_PORT:-3050}:3050"
    networks:
      - control-edge
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3050/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 256m
    mem_reservation: 64m
    cpus: "0.5"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Optional profile: ai
  #
  # Lab only. The five hardening gates (authn, entitlement check, persistent
  # metering, secret vault, /ready) are implemented, but ai=central stays lab:
  # the wallet ledger is still being wired from Entitlement, and maturity is
  # not pilot/production. Preflight still refuses ai=central for those stages.
  # Use ai=off or ai=local_byok outside this lab profile.
  #
  # Postgres (database ai_platform) holds connections, metering, and the wallet.
  # The volume is the TTS cache only.
  # ---------------------------------------------------------------------------
  ai-platform:
    <<: *restart
    profiles: ["ai"]
    build:
      context: ../../services/ai-platform
    image: ${AI_PLATFORM_IMAGE:-luminaryworks/ai-platform:local}
    depends_on:
      control-plane-db:
        condition: service_healthy
    environment:
      NODE_ENV: ${AI_PLATFORM_NODE_ENV:-production}
      PORT: "13100"
      AI_PLATFORM_MIGRATIONS_RUN: "true"
      AI_PLATFORM_DATABASE_URL: postgres://${AI_PLATFORM_DB_USER:-ai_platform}:${AI_PLATFORM_DB_PASSWORD:?set AI_PLATFORM_DB_PASSWORD in deploy/env/control-plane.env}@control-plane-db:5432/${AI_PLATFORM_DB_NAME:-ai_platform}
      AI_VAULT_MASTER_KEY: ${AI_VAULT_MASTER_KEY:?set AI_VAULT_MASTER_KEY (32-byte hex/base64) in deploy/env/control-plane.env}
      AI_PLATFORM_DATA_DIR: /data
      AI_PLATFORM_AUTH_MODE: oidc
      # Issuer must match the JWT iss (upstream IdP). JWKS may be the gateway.
      AI_PLATFORM_OIDC_ISSUER: ${AI_PLATFORM_OIDC_ISSUER:-http://identity:3001/oidc}
      AI_PLATFORM_OIDC_AUDIENCE: ${AI_PLATFORM_OIDC_AUDIENCE:-https://ai.luminaryworks.dev}
      AI_PLATFORM_JWKS_URI: ${AI_PLATFORM_JWKS_URI:-http://auth-gateway:3010/oidc/jwks}
      AI_PLATFORM_SERVICE_API_KEY: ${AI_PLATFORM_SERVICE_API_KEY:?set AI_PLATFORM_SERVICE_API_KEY in deploy/env/control-plane.env}
      AI_PLATFORM_SERVICE_PRODUCT_CODES: ${AI_PLATFORM_SERVICE_PRODUCT_CODES:-}
      AI_PLATFORM_SERVICE_INTERNAL: ${AI_PLATFORM_SERVICE_INTERNAL:-true}
      AI_PLATFORM_SERVICE_CREDENTIALS_JSON: ${AI_PLATFORM_SERVICE_CREDENTIALS_JSON:-}
      ENTITLEMENT_BASE_URL: http://entitlement:3040
      ENTITLEMENT_SERVICE_API_KEY: ${ENTITLEMENT_SERVICE_API_KEY:?set ENTITLEMENT_SERVICE_API_KEY in deploy/env/control-plane.env}
      PUBLIC_API_ENABLED: "false"
      AI_PLATFORM_WALLET_ENFORCE: ${AI_PLATFORM_WALLET_ENFORCE:-false}
    volumes:
      - ai-platform-data:/data
    ports:
      - "${CONTROL_PLANE_BIND_ADDR:-127.0.0.1}:${AI_PLATFORM_PORT:-13100}:13100"
    networks:
      - control-data
      - control-edge
    healthcheck:
      # Readiness probes Postgres and the vault. GET /v1/health stays liveness-only.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:13100/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Optional profile: observability
  #
  # Products propagate `traceparent` / `x-request-id`; this collector only
  # aggregates. Products deployed standalone can leave it off entirely.
  # ---------------------------------------------------------------------------
  otel-collector:
    <<: *restart
    profiles: ["observability"]
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.115.1}
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "${CONTROL_PLANE_BIND_ADDR:-127.0.0.1}:${OTEL_GRPC_PORT:-4317}:4317"
      - "${CONTROL_PLANE_BIND_ADDR:-127.0.0.1}:${OTEL_HTTP_PORT:-4318}:4318"
    networks:
      - control-edge
