# Local-debugging override: publish control-plane datastores on loopback.
#
# Never use this in pilot or production — `scripts/preflight-control-plane.mjs`
# fails a hardened stage when a database or Redis port is published.
#
# One Postgres hosts four logical DBs; a single host port is enough for all of
# them (connect with dbname=logto|entitlement|notification|ai_platform).
#
#   docker compose --env-file deploy/env/control-plane.env \
#     -f deploy/compose/control-plane.yaml \
#     -f deploy/compose/control-plane.dev-ports.yaml up -d

services:
  control-plane-db:
    ports:
      - "127.0.0.1:${CONTROL_PLANE_DB_PORT:-5433}:5432"

  identity-redis:
    ports:
      - "127.0.0.1:${IDENTITY_REDIS_PORT:-6381}:6379"
