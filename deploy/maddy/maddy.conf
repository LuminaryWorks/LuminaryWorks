## Send-only Maddy. Submission on 587. No inbound SMTP, no IMAP.
## One account, "notify", may send as any address at the local domains.

$(hostname) = mail.luminaryworks.dev
$(primary_domain) = luminaryworks.dev
$(local_domains) = luminaryworks.dev dataluminary.dev

tls file /data/tls/fullchain.pem /data/tls/privkey.pem

auth.pass_table local_authdb {
    table sql_table {
        driver sqlite3
        dsn credentials.db
        table_name passwords
    }
}

hostname $(hostname)

submission tcp://0.0.0.0:587 {
    tls file /data/tls/fullchain.pem /data/tls/privkey.pem
    auth &local_authdb
    limits {
        all rate 20 1s
    }

    source $(local_domains) {
        check {
            authorize_sender {
                prepare_email identity
                user_to_email static {
                    entry notify "*"
                }
            }
        }
        default_destination {
            modify {
                dkim luminaryworks.dev dataluminary.dev default
            }
            deliver_to &remote_queue
        }
    }
    default_source {
        reject 501 5.1.8 "Non-local sender domain"
    }
}

target.remote outbound_delivery {
    limits {
        destination rate 10 1s
        destination concurrency 5
    }
    mx_auth {
        dane
        mtasts {
            cache fs
            fs_dir mtasts_cache/
        }
        local_policy {
            min_tls_level encrypted
            min_mx_level none
        }
    }
}

target.queue remote_queue {
    target &outbound_delivery
    autogenerated_msg_domain $(primary_domain)
    bounce {
        default_destination {
            reject 550 5.0.0 "Refusing to send DSNs to non-local addresses"
        }
    }
}
