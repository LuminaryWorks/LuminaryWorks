name: Deploy remote

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type laptop-pack — this workflow must not compose-build on ubuntu-latest"
        required: true
        type: string

# Personal OVH: pack on the laptop, then remote-deploy.mjs --pack.
# GitHub-hosted minutes are 2000/month on private repos; do not docker compose build here.
permissions:
  contents: read

jobs:
  refuse-hosted-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Point operators at laptop pack
        run: |
          echo "Do not deploy OVH from GitHub-hosted runners."
          echo "On the laptop (linux/amd64 even on Apple Silicon):"
          echo "  node scripts/pack-release.mjs --target control-plane --platform linux/amd64"
          echo "  node scripts/remote-deploy.mjs --pack dist/packs/<tar> --host \"\$DEPLOY_HOST\" --user debian --key ~/.ssh/id_ed25519_lw_ovh"
          echo "Site intent (no secrets): deploy/site.example.json / pnpm site:check"
          if [[ "${{ github.event.inputs.confirm }}" != "laptop-pack" ]]; then
            echo "Type laptop-pack in the confirm input if you only wanted to see this message."
            exit 1
          fi
          exit 1
