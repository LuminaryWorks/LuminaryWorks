name: luminary-works-notification

services:
  notification-db:
    image: postgres:16-alpine
    container_name: luminary-notification-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_dev}
      POSTGRES_DB: notification
    ports:
      - "${NOTIFICATION_DB_PORT:-5435}:5432"
    volumes:
      - luminary_notification_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  luminary_notification_pg:
